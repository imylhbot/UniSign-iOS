name: Build & Release SoulSign iOS & PC Helper

# Triggers: Push to main or manually via GitHub Actions web UI (workflow_dispatch)
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Release Tag Name (e.g. v2.5.0)'
        required: true
        default: 'v2.5.0'
      release_title:
        description: 'Release Title'
        required: false
        default: 'SoulSign iOS & PC Helper Release'

# Grant GITHUB_TOKEN write access to create releases and upload assets
permissions:
  contents: write

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-14
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          xcodebuild -version

      - name: Build SoulSign (Ad-Hoc / Sideloadable)
        run: |
          set -o pipefail
          xcodebuild build \
            -project SoulSign.xcodeproj \
            -scheme SoulSign \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            COMPILER_INDEX_STORE_ENABLE=NO \
            2>&1 | tee xcodebuild.log || (echo "=== COMPILER ERRORS ===" && grep -C 2 -E "error:" xcodebuild.log && exit 1)

      - name: Package into IPA
        run: |
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: .app file not found!"
            exit 1
          fi
          echo "Found app at: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r -9 SoulSign.ipa Payload
          rm -rf Payload
          echo "SoulSign.ipa created successfully!"

      - name: Upload IPA to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SoulSign-IPA
          path: SoulSign.ipa
          retention-days: 14

  release:
    name: Create GitHub Release
    needs: [build-ios]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download iOS IPA Artifact
        uses: actions/download-artifact@v4
        with:
          name: SoulSign-IPA

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: ${{ github.event.inputs.version_tag || 'v2.5.0' }}
          name: ${{ github.event.inputs.release_title || 'SoulSign iOS Release' }} (${{ github.event.inputs.version_tag || 'v2.5.0' }})
          body: |
            ## ⚡ SoulSign-iOS 官方发布

            - **版本**: ${{ github.event.inputs.version_tag || 'v2.5.0' }}
            - **iOS 客户端**: `SoulSign.ipa`（最低支持 iOS 15.0+，支持多 Apple ID 管理、单账号 3 个 App 配额管控、SideStore 级 GrandSlam 登录与会话有效性检测、一键自动续期、Safari 真实 UDID 读取、本地安装）。
          files: |
            SoulSign.ipa
            ca.mobileconfig
            udid.mobileconfig
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
