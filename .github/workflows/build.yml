name: Build & Release UniSign iOS & PC Helper

# Triggers: Push to main or manually via GitHub Actions web UI
on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Release Tag Name (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
      release_title:
        description: 'Release Title'
        required: false
        default: 'UniSign iOS & PC Helper Release'

# Grant GITHUB_TOKEN write access to create releases and upload assets
permissions:
  contents: write

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-14
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          xcodebuild -version

      - name: Build UniSign (Ad-Hoc / Sideloadable)
        run: |
          set -o pipefail
          xcodebuild build \
            -project UniSign.xcodeproj \
            -scheme UniSign \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            COMPILER_INDEX_STORE_ENABLE=NO \
            2>&1 | tee xcodebuild.log || (echo "=== COMPILER ERRORS ===" && grep -C 2 -E "error:" xcodebuild.log && exit 1)

      - name: Package into IPA
        run: |
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: .app file not found!"
            exit 1
          fi
          echo "Found app at: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r -9 UniSign.ipa Payload
          rm -rf Payload
          echo "UniSign.ipa created successfully!"

      - name: Upload IPA to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: UniSign-IPA
          path: UniSign.ipa
          retention-days: 14

  build-pc-helper:
    name: Build Windows PC Helper
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 cryptography requests pycryptodome pyinstaller

      - name: Build UniSign-Helper.exe
        run: |
          cd UniSign-Helper
          pyinstaller --onefile --noconsole --name "UniSign-Helper" unisign_helper_gui.py

      - name: Package Windows ZIP
        shell: pwsh
        run: |
          cd UniSign-Helper
          New-Item -ItemType Directory -Force -Path package
          Copy-Item dist\UniSign-Helper.exe package\
          Copy-Item run_helper.bat package\
          Copy-Item README.md package\
          Compress-Archive -Path package\* -DestinationPath ..\UniSign-Helper-Windows.zip -Force

      - name: Upload Windows Helper to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: UniSign-Helper-Windows
          path: UniSign-Helper-Windows.zip
          retention-days: 14

  release:
    name: Create GitHub Release
    needs: [build-ios, build-pc-helper]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download iOS IPA Artifact
        uses: actions/download-artifact@v4
        with:
          name: UniSign-IPA

      - name: Download Windows PC Helper Artifact
        uses: actions/download-artifact@v4
        with:
          name: UniSign-Helper-Windows

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: ${{ github.event.inputs.version_tag || 'v1.0.0' }}
          name: ${{ github.event.inputs.release_title || 'UniSign iOS & PC Helper Release' }} (${{ github.event.inputs.version_tag || 'v1.0.0' }})
          body: |
            ## UniSign-iOS & PC 助手官方发布

            - **版本**: ${{ github.event.inputs.version_tag || 'v1.0.0' }}
            - **iOS 客户端**: `UniSign.ipa`（iOS 13.0+，支持纯手机端重签、多账号切换、7天续期、批量续期、配置定制）。
            - **PC 电脑端助手**: `UniSign-Helper-Windows.zip`（Windows 10/11，解压即用，支持 USB 一键直装已签名 IPA、iOS 16+ 开发者模式一键激活）。

            ### 💻 PC 客户端使用方法：
            1. 下载 `UniSign-Helper-Windows.zip` 并解压。
            2. 运行 `UniSign-Helper.exe`（或双击 `run_helper.bat`）。
            3. 数据线连接手机，拖入已签名 IPA，点击「一键直装」秒速完成安装！
          files: |
            UniSign.ipa
            UniSign-Helper-Windows.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
