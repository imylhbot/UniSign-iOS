name: Manual Build & Release UniSign IPA

# Only manually triggered via GitHub Actions web UI
on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Release Tag Name (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
      release_title:
        description: 'Release Title'
        required: false
        default: 'UniSign iOS Release'

# Grant GITHUB_TOKEN write access to create releases and upload assets
permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          xcodebuild -version

      - name: Build UniSign (Ad-Hoc / Sideloadable)
        run: |
          set -o pipefail
          xcodebuild build \
            -project UniSign.xcodeproj \
            -scheme UniSign \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            COMPILER_INDEX_STORE_ENABLE=NO \
            2>&1 | tee xcodebuild.log || (echo "=== COMPILER ERRORS ===" && grep -C 2 -E "error:" xcodebuild.log && exit 1)

      - name: Package into IPA
        run: |
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: .app file not found!"
            exit 1
          fi
          echo "Found app at: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r -9 UniSign.ipa Payload
          rm -rf Payload
          echo "UniSign.ipa created successfully!"

      - name: Upload IPA to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: UniSign-IPA
          path: UniSign.ipa
          retention-days: 14

      - name: Create GitHub Release and Upload IPA
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: ${{ github.event.inputs.version_tag }}
          name: ${{ github.event.inputs.release_title }} (${{ github.event.inputs.version_tag }})
          body: |
            ## UniSign-iOS 安装包发布
            
            - **版本**: ${{ github.event.inputs.version_tag }}
            - **兼容性**: iOS 13.0 及以上设备
            - **特性**: 纯手机端本地免越狱重签、多 Apple ID 切换、7天免费证书一键续期、3-app 配额限制统计、P12 有效期检测、插件注入与文件访问开启。
            
            ### 📱 安装方式：
            - 下载下方 Assets 中的 `UniSign.ipa`。
            - 使用 **TrollStore（巨魔）**、**AltStore**、**SideStore** 或 **牛蛙助手** 直接安装到手机即可使用。
          files: UniSign.ipa
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
