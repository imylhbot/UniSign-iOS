name: Build & Release SoulSign iOS & PC Helper

# Triggers: Manually via GitHub Actions web UI (workflow_dispatch)
on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Release Tag Name (e.g. v2.5.0)'
        required: true
        default: 'v2.5.0'
      release_title:
        description: 'Release Title'
        required: false
        default: 'SoulSign iOS & PC Helper Release'

# Grant GITHUB_TOKEN write access to create releases and upload assets
permissions:
  contents: write

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-14
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          xcodebuild -version

      - name: Build SoulSign (Ad-Hoc / Sideloadable)
        run: |
          set -o pipefail
          xcodebuild build \
            -project UniSign.xcodeproj \
            -scheme UniSign \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            COMPILER_INDEX_STORE_ENABLE=NO \
            2>&1 | tee xcodebuild.log || (echo "=== COMPILER ERRORS ===" && grep -C 2 -E "error:" xcodebuild.log && exit 1)

      - name: Package into IPA
        run: |
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: .app file not found!"
            exit 1
          fi
          echo "Found app at: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r -9 SoulSign.ipa Payload
          rm -rf Payload
          echo "SoulSign.ipa created successfully!"

      - name: Upload IPA to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SoulSign-IPA
          path: SoulSign.ipa
          retention-days: 14

  build-pc-helper:
    name: Build Windows PC Helper
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 cryptography requests pycryptodome pyinstaller pillow

      - name: Download Apple Code Signing Engine (rcodesign.exe)
        shell: pwsh
        run: |
          cd UniSign-Helper
          python -c "import urllib.request, zipfile, io; url = 'https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign%2F0.29.0/apple-codesign-0.29.0-x86_64-pc-windows-msvc.zip'; data = urllib.request.urlopen(url, timeout=60).read(); z = zipfile.ZipFile(io.BytesIO(data)); [z.extract(f, '.') for f in z.namelist() if f.endswith('rcodesign.exe')]"
          if (Test-Path "apple-codesign-0.29.0-x86_64-pc-windows-msvc/rcodesign.exe") {
            Move-Item -Force "apple-codesign-0.29.0-x86_64-pc-windows-msvc/rcodesign.exe" "rcodesign.exe"
            Remove-Item -Recurse -Force "apple-codesign-0.29.0-x86_64-pc-windows-msvc"
          }
          if (Test-Path "rcodesign.exe") {
            Write-Host "rcodesign.exe successfully downloaded!"
          }

      - name: Build SoulSign-Helper.exe
        run: |
          cd UniSign-Helper
          pyinstaller --onefile --noconsole --clean --icon="soulsign.ico" --add-data "soulsign.ico;." --add-data "soulsign.png;." --add-binary "rcodesign.exe;." --name "SoulSign-Helper" unisign_helper_gui.py

      - name: Package Windows ZIP
        shell: pwsh
        run: |
          cd UniSign-Helper
          New-Item -ItemType Directory -Force -Path package
          Copy-Item dist\SoulSign-Helper.exe package\
          Copy-Item rcodesign.exe package\
          Copy-Item run_helper.bat package\
          Copy-Item README.md package\
          Copy-Item soulsign.ico package\
          Copy-Item soulsign.png package\
          Compress-Archive -Path package\* -DestinationPath ..\SoulSign-Helper-Windows.zip -Force

      - name: Upload Windows Helper to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SoulSign-Helper-Windows
          path: SoulSign-Helper-Windows.zip
          retention-days: 14

  release:
    name: Create GitHub Release
    needs: [build-ios, build-pc-helper]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download iOS IPA Artifact
        uses: actions/download-artifact@v4
        with:
          name: SoulSign-IPA

      - name: Download Windows PC Helper Artifact
        uses: actions/download-artifact@v4
        with:
          name: SoulSign-Helper-Windows

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: ${{ github.event.inputs.version_tag || 'v2.5.0' }}
          name: ${{ github.event.inputs.release_title || 'SoulSign iOS & PC Helper Release' }} (${{ github.event.inputs.version_tag || 'v2.5.0' }})
          body: |
            ## ⚡ SoulSign-iOS & PC 助手官方发布

            - **版本**: ${{ github.event.inputs.version_tag || 'v2.5.0' }}
            - **iOS 客户端**: `SoulSign.ipa`（iOS 13.0+，支持纯手机端重签、多账号切换、7天自动续期、P12 离线签名、Safari 真实 UDID 一键读取、HTTPS 本地 OTA 安装、动态库 Dylib 注入定制）。
            - **PC 电脑端助手**: `SoulSign-Helper-Windows.zip`（Windows 10/11，解压即用，内置 rcodesign 签名引擎，支持 USB 一键直装已签名 IPA、免费 Apple ID 7 天自动自签、iOS 16+ 开发者模式一键激活）。

            ### 💻 PC 客户端使用方法：
            1. 下载 `SoulSign-Helper-Windows.zip` 并解压。
            2. 运行 `SoulSign-Helper.exe`（或双击 `run_helper.bat`）。
            3. 数据线连接手机并信任电脑，拖入待签或已签名 IPA，点击「一键签名并安装」秒速完成！
          files: |
            SoulSign.ipa
            SoulSign-Helper-Windows.zip
            ca.mobileconfig
            udid.mobileconfig
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
